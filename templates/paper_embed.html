<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ paper.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '\\(', right: '\\)', display: false},{left: '\\[', right: '\\]', display: true}], throwOnError: false});"></script>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            max-width: 46rem;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
            line-height: 1.75;
            color: #1e293b;
            font-size: 1.05rem;
            background: #fff;
        }
        h1, h2, h3, h4 { font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; color: #0f172a; line-height: 1.3; margin-top: 2em; }
        h1 { font-size: 1.7rem; margin-top: 0.5em; }
        h2 { font-size: 1.35rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3rem; }
        h3 { font-size: 1.15rem; }
        img { max-width: 100%; height: auto; display: block; margin: 1.25rem auto; }
        figure { margin: 1.5rem 0; text-align: center; }
        figcaption { font-size: 0.9rem; color: #64748b; margin-top: 0.5rem; }
        table { border-collapse: collapse; margin: 1.25rem auto; font-size: 0.92rem; display: block; overflow-x: auto; max-width: 100%; }
        th, td { border: 1px solid #cbd5e1; padding: 0.4rem 0.65rem; }
        th { background: #f8fafc; }
        blockquote { border-left: 3px solid #cbd5e1; margin-left: 0; padding-left: 1rem; color: #475569; }
        pre, code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.9em; background: #f1f5f9; }
        pre { padding: 0.75rem; overflow-x: auto; border-radius: 6px; }
        a { color: #2563eb; }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }
    </style>
</head>
<body>
    {{ html_content|safe }}
</body>
</html>
